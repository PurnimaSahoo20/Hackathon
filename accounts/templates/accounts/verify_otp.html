<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - HackNexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <style>
        :root {
            --primary: #ea580c;
            --primary-light: #ffedd5;
            --bg: #f9fafb;
            --text: #111827;
            --text-light: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glassmorphism Background */
        .blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(100px);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.15;
        }

        .blob-1 { width: 400px; height: 400px; top: -100px; right: -100px; }
        .blob-2 { width: 300px; height: 300px; bottom: -50px; left: -50px; background: #7c3aed; }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .otp-card {
            background: white;
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #7c3aed);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-light);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .email-preview {
            display: block;
            font-weight: 700;
            color: var(--text);
            margin-top: 4px;
        }

        .otp-form {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .otp-input {
            width: 60px;
            height: 70px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
            background: #fff;
        }

        .otp-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
            transform: translateY(-2px);
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.3);
            filter: brightness(1.1);
        }

        .verify-btn:active {
            transform: translateY(0);
        }

        .resend-box {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-light);
        }

        .resend-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        .messages {
            margin-bottom: 20px;
            list-style: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .message.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
        }

        .message.info {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #dbeafe;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .otp-input {
                width: 50px;
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="message {{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <div class="otp-card">
            <div class="icon-box">
                <ion-icon name="mail-open-outline"></ion-icon>
            </div>
            <h1>Two-Factor Auth</h1>
            <p>We've sent a 4-digit code to <span class="email-preview">{{ email }}</span></p>

            <form method="POST" id="otp-form">
                {% csrf_token %}
                <!-- Real input hidden -->
                <input type="hidden" name="otp" id="real-otp">
                
                <div class="otp-form">
                    <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" required>
                </div>

                <button type="submit" class="verify-btn">
                    Verify & Continue
                    <ion-icon name="arrow-forward-outline"></ion-icon>
                </button>
            </form>

            <div class="resend-box">
                Didn't receive the code? <br>
                <a href="{% url 'login' %}" class="resend-link">Restart Login</a>
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const realInput = document.getElementById('real-otp');
        const form = document.getElementById('otp-form');

        inputs.forEach((input, index) => {
            // Handle typing
            input.addEventListener('input', (e) => {
                if (e.data && inputs[index + 1]) {
                    inputs[index + 1].focus();
                }
                updateRealInput();
            });

            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && inputs[index - 1]) {
                    inputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 4);
                if (/^\d+$/.test(pasteData)) {
                    pasteData.split('').forEach((char, i) => {
                        if (inputs[i]) inputs[i].value = char;
                    });
                    updateRealInput();
                    inputs[Math.min(pasteData.length, 3)].focus();
                }
            });
        });

        function updateRealInput() {
            let fullOtp = "";
            inputs.forEach(input => fullOtp += input.value);
            realInput.value = fullOtp;
        }

        // Auto focus first input
        window.addEventListener('load', () => {
            inputs[0].focus();
        });

        // Prevent double-submission on form submit
        document.addEventListener('submit', (e) => {
            const form = e.target;
            setTimeout(() => {
                if (e.defaultPrevented) return;
                const submitBtns = form.querySelectorAll('button[type="submit"], input[type="submit"]');
                submitBtns.forEach((btn) => {
                    btn.disabled = true;
                    btn.style.opacity = '0.6';
                    btn.style.cursor = 'not-allowed';
                });
            }, 10);
        });
    </script>
</body>
</html>
