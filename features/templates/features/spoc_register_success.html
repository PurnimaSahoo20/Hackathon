<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Submitted — HackNexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #fffbf7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #fff; border-radius: 20px; padding: 48px 40px; text-align: center; border: 1px solid #f3f4f6; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .icon { font-size: 56px; margin-bottom: 16px; }
        h2 { color: #059669; font-size: 26px; font-weight: 900; margin: 0 0 8px; }
        p  { color: #6b7280; font-size: 15px; line-height: 1.6; margin: 0; }
        .email { background: #ecfdf5; border: 1px solid #d1fae5; border-radius: 10px; padding: 12px 20px; margin: 20px 0; font-weight: 700; color: #059669; }
    </style>
</head>
<body>
<div class="box">
    <div class="icon">✅</div>
    <h2>Registration Submitted!</h2>
    <p>Your SPOC registration has been received and is under review.</p>
    <div class="email">{{ email }}</div>
    <p>You will receive an email with your login credentials once your application is approved by the administrator.</p>
</div>
</body>
</html>
