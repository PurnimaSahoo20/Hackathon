<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — HackNexus SPOC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#fff8f1 0%,#ffedd5 50%,#fff8f1 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(234,88,12,0.14),0 4px 16px rgba(0,0,0,0.06);text-align:center}
        .brand{font-size:22px;font-weight:900;color:#ea580c;margin-bottom:32px}
        .brand span{color:#7c3aed}
        .icon{font-size:48px;margin-bottom:16px}
        h2{font-size:24px;font-weight:800;color:#111827;margin-bottom:8px;letter-spacing:-0.02em}
        .sub{font-size:14px;color:#6b7280;margin-bottom:8px;line-height:1.5}
        .email{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#ea580c;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 12px;display:inline-block;margin-bottom:28px}
        .otp-row{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
        .otp-input{width:64px;height:64px;border:2px solid #e5e7eb;border-radius:12px;font-size:28px;font-weight:800;font-family:'JetBrains Mono',monospace;text-align:center;color:#111827;background:#f9fafb;outline:none;transition:all 0.2s}
        .otp-input:focus{border-color:#ea580c;background:#fff;box-shadow:0 0 0 3px rgba(234,88,12,0.1)}
        .btn{width:100%;padding:14px;background:#ea580c;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.2s}
        .btn:hover{background:#c2410c;transform:translateY(-1px)}
        .resend{margin-top:16px;font-size:13px;color:#6b7280}
        .resend a{color:#ea580c;font-weight:600;text-decoration:none}
        .msg{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:20px;text-align:left}
        .msg-error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
        .timer{font-size:13px;color:#6b7280;margin-top:10px;font-family:'JetBrains Mono',monospace}
        .timer span{color:#ea580c;font-weight:700}
    </style>
</head>
<body>
<div class="card">
    <div class="brand">Hack<span>Nexus</span> SPOC</div>
    <div class="icon">🔐</div>
    <h2>Two-Factor Verification</h2>
    <p class="sub">A 4-digit code was sent to</p>
    <div class="email">{{ email }}</div>

    {% for message in messages %}
    <div class="msg msg-error">{{ message }}</div>
    {% endfor %}

    <form method="POST" id="otp-form">
        {% csrf_token %}
        <div class="otp-row">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d1" autofocus>
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d2">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d3">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d4">
        </div>
        <input type="hidden" name="otp" id="otp-hidden">
        <button type="submit" class="btn">Verify & Login →</button>
    </form>
    <div class="timer">Code expires in <span id="countdown">10:00</span></div>
    <p class="resend">Didn't receive? <a href="{% url 'spoc_login' %}">Back to Login</a></p>
</div>
<script>
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((inp, i) => {
        inp.addEventListener('input', e => {
            if (e.target.value && i < inputs.length - 1) inputs[i+1].focus();
        });
        inp.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !e.target.value && i > 0) inputs[i-1].focus();
        });
        inp.addEventListener('paste', e => {
            const pasted = (e.clipboardData || window.clipboardData).getData('text').slice(0,4);
            pasted.split('').forEach((ch, idx) => { if (inputs[idx]) inputs[idx].value = ch; });
            if (inputs[pasted.length - 1]) inputs[pasted.length - 1].focus();
            e.preventDefault();
        });
    });
    document.getElementById('otp-form').addEventListener('submit', e => {
        document.getElementById('otp-hidden').value = [...inputs].map(i => i.value).join('');
    });
    // Countdown
    let secs = 600;
    const cd = document.getElementById('countdown');
    const t = setInterval(() => {
        secs--;
        if (secs <= 0) { clearInterval(t); cd.textContent = 'Expired'; cd.style.color='#dc2626'; }
        else { cd.textContent = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`; }
    }, 1000);
</script>
</body>
</html>
